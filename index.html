<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الموقع تحت الصيانة</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2f5d1e">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@600;700&display=swap">
<style>
  /* صفحة صيانة ثابتة: لا تحمّل أي بيانات */
  :root { --bg: #f4ecdc; --card: #fffcf5; --line: #e2d5b8; --ink: #2b2118; --gold: #b8860b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17140f; --card: #221d16; --line: #3a3124; --ink: #f1e7d4; --gold: #e0b44a; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans Arabic", system-ui, "Segoe UI", Tahoma, sans-serif;
  }
  .card {
    width: min(420px, 100%); padding: 40px 24px; border-radius: 26px; text-align: center;
    background: var(--card); border: 1px solid var(--line); box-shadow: 0 18px 50px rgba(60, 40, 10, .12);
  }
  svg { width: 54px; height: 54px; color: var(--gold); }
  h1 { margin: 14px 0 0; font-size: clamp(1.4rem, 6vw, 1.8rem); font-weight: 700; }
</style>
</head>
<body>
  <main class="card">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
    </svg>
    <h1>الموقع تحت الصيانة</h1>
  </main>
</body>
</html>
